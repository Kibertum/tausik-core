name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint is its OWN job, parallel to the tests. A hard ruff failure used to sit before
  # the pytest step in one job and hide every test result — that is how a Python 3.13
  # incompatibility shipped masked on a third of the matrix (v1.7.0). Decoupled, a red
  # lint no longer conceals a red (or green) test run. ruff/mypy/bandit are static and
  # version-independent, so this runs once, not across the 9-cell matrix.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linters
        run: pip install ruff mypy bandit
      - name: Lint (ruff)
        run: ruff check scripts/ tests/ bootstrap/
      - name: Type check (mypy, advisory)
        run: mypy scripts/ --ignore-missing-imports --no-error-summary || true
      - name: Security scan (bandit, advisory)
        run: bandit -r scripts/ -ll -q || true

  # Fast lane across the full matrix. `pytest tests/` inherits addopts = -m 'not slow'
  # from pyproject, so this is the quick lane — broad platform/version coverage, ~5 min.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        # ruff/mypy/bandit are not just linters here: ~30 tests shell out to them as
        # subprocess fixtures (test_ble001_enforced, test_gates, ...). Without them those
        # tests fail 'No module named ruff'. The lint job runs ruff as the GATE; this is deps.
        #
        # requirements.txt (mcp) is NOT optional. Without it three tests fail for one
        # reason wearing three faces: `test_mcp_no_deprecated_primitives` errors with
        # ModuleNotFoundError instead of skipping, and `test_mypy_clean` reports three
        # import-not-found errors in the MCP server as if the TYPES had regressed. A red
        # that says "your code is broken" about a runner nobody provisioned costs more
        # than the install does. The file carries an upper bound, so this cannot pull in
        # a major release on its own.
        run: |
          pip install pytest ruff mypy bandit
          pip install -r requirements.txt
      - name: Bootstrap host profiles (required by mirror-sync tests)
        # BOTH profiles, not just claude. `.claude` and `.qwen` settings are generated by
        # DIFFERENT functions, and `test_both_host_profiles_are_actually_scanned` exists
        # because the second one was forgotten once already — so with only claude deployed
        # it found one profile and failed, defeated by a runner that had one.
        # `--ide all` rather than repeating the flag: `--ide` is a single choice, not an
        # appending one, so `--ide claude --ide qwen` would deploy qwen and drop claude.
        run: python bootstrap/bootstrap.py --no-detect --ide all
      - name: Doc-constants drift check
        run: python scripts/gen_doc_constants.py --check --skip-test-count
      - name: Run fast lane
        run: pytest tests/ -v --tb=short --ignore=tests/test_bootstrap_skills_coverage.py --ignore=tests/test_bootstrap_real.py

  # Full lane (slow tests INCLUDED) on one representative cell. The slow-marked tests are
  # the project's own critical regression tests (wiring, MCP integration, subprocess
  # smoke); the fast lane deselects them, so without this job CI would gate a green badge
  # over tests it never runs. ubuntu-3.13 is the cell where the last hidden failure lived.
  # One cell, ~17 min — 1x cost, not 9x — but the blind spot is closed.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test deps
        # ruff/mypy/bandit are not just linters here: ~30 tests shell out to them as
        # subprocess fixtures (test_ble001_enforced, test_gates, ...). Without them those
        # tests fail 'No module named ruff'. The lint job runs ruff as the GATE; this is deps.
        #
        # requirements.txt (mcp) is NOT optional. Without it three tests fail for one
        # reason wearing three faces: `test_mcp_no_deprecated_primitives` errors with
        # ModuleNotFoundError instead of skipping, and `test_mypy_clean` reports three
        # import-not-found errors in the MCP server as if the TYPES had regressed. A red
        # that says "your code is broken" about a runner nobody provisioned costs more
        # than the install does. The file carries an upper bound, so this cannot pull in
        # a major release on its own.
        run: |
          pip install pytest ruff mypy bandit
          pip install -r requirements.txt
      - name: Bootstrap host profiles (required by mirror-sync tests)
        # BOTH profiles, not just claude. `.claude` and `.qwen` settings are generated by
        # DIFFERENT functions, and `test_both_host_profiles_are_actually_scanned` exists
        # because the second one was forgotten once already — so with only claude deployed
        # it found one profile and failed, defeated by a runner that had one.
        # `--ide all` rather than repeating the flag: `--ide` is a single choice, not an
        # appending one, so `--ide claude --ide qwen` would deploy qwen and drop claude.
        run: python bootstrap/bootstrap.py --no-detect --ide all
      - name: Doc-constants drift check
        run: python scripts/gen_doc_constants.py --check --skip-test-count
      - name: Run FULL lane (fast + slow)
        run: pytest tests/ -m '' --tb=short --ignore=tests/test_bootstrap_skills_coverage.py --ignore=tests/test_bootstrap_real.py
