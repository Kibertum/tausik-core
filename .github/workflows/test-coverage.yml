name: Test Coverage Bot

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pytest-xdist is required, not optional: pyproject's addopts carry `-n auto`,
        # and without the plugin pytest exits on `unrecognized arguments: -n` before
        # collecting anything. The `|| true` on the run step below would then swallow
        # that death and this job would report "no coverage data" instead of a failure.
        run: pip install pytest pytest-xdist pytest-cov

      # The deployed IDE profiles (.claude, .cursor, .kilo, .opencode, .qwen) and
      # .tausik/ are bootstrap OUTPUT and are gitignored, so a fresh clone has
      # neither. Fourteen test files need them and failed here every run —
      # measured on a pristine clone, identical list across two runs — while
      # `|| true` below turned that into silence and the coverage number was
      # computed on the remainder. The gating lanes (tests.yml, .gitlab-ci.yml)
      # have always run this step; only this advisory lane did not.
      - name: Deploy IDE profiles
        run: python bootstrap/bootstrap.py --no-detect --ide all

      - name: Run tests with coverage
        # ADVISORY, NOT SILENT. This lane deliberately does not gate the PR, so
        # the coverage report is still uploaded when tests fail — that is what
        # the `|| true` was for. But a failure that produces no signal is the
        # silent error this project refuses everywhere else, so the exit code is
        # CAPTURED and re-reported as a loud annotation instead of discarded.
        id: pytest
        run: |
          set +e
          pytest tests/ -v --cov=scripts --cov-report=json:coverage.json --cov-report=term-missing
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Say so when the measured run was not green
        if: steps.pytest.outputs.exit_code != '0'
        run: |
          echo "::warning title=Coverage measured on a failing run::pytest exited ${{ steps.pytest.outputs.exit_code }}. The percentage below covers only the tests that ran."

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          if-no-files-found: ignore

      - name: Check coverage on changed files
        id: coverage
        run: |
          python -c "
          import json, subprocess, sys

          # Get changed Python files
          result = subprocess.run(
              ['git', 'diff', '--name-only', 'origin/main...HEAD', '--', 'scripts/*.py'],
              capture_output=True, text=True
          )
          changed = [f for f in result.stdout.strip().split('\n') if f.endswith('.py')]
          if not changed:
              print('No Python files changed in scripts/')
              sys.exit(0)

          # Load coverage data
          try:
              with open('coverage.json') as f:
                  cov = json.load(f)
          except FileNotFoundError:
              print('No coverage data')
              sys.exit(0)

          files = cov.get('files', {})
          threshold = 70  # percent

          low_coverage = []
          for cf in changed:
              if cf in files:
                  pct = files[cf]['summary']['percent_covered']
                  if pct < threshold:
                      low_coverage.append((cf, pct))
              else:
                  low_coverage.append((cf, 0))

          if low_coverage:
              print(f'Low coverage files ({len(low_coverage)}):')
              for f, pct in low_coverage:
                  print(f'  {f}: {pct:.0f}%')
              # Don't fail, just warn
              with open('coverage-report.txt', 'w') as f:
                  f.write(f'Low coverage on {len(low_coverage)} changed file(s):\n')
                  for ff, pct in low_coverage:
                      f.write(f'- \`{ff}\`: {pct:.0f}% (threshold: {threshold}%)\n')
          else:
              print('All changed files meet coverage threshold')
          "

      - name: Comment coverage report
        if: hashFiles('coverage-report.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage-report.txt', 'utf8');
            const body = `## 📊 Test Coverage\n\n${report}\n\nConsider adding tests for uncovered code.\n\n---\nGenerated by Test Coverage Bot`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
