# TAUSIK — CI on the development remote.
#
# Development happens here, on GitLab. github.com/Kibertum/tausik-core is a
# release mirror, published by hand off an orphan lineage. Until this file
# existed, the test suite first saw a commit *after* it had been merged, tagged
# and published — the gate stood behind the door.
#
# That gap has a name: the CRLF bug. Signatures computed over raw bytes verified
# only on the machine that made them, every skill was refused on Linux, and every
# run on the maintainer's Windows box was green. Windows is covered by the
# developer's machine; macOS has never produced a finding. Linux is the half that
# was missing, so Linux is what this pipeline runs.
#
# The GitHub matrix (ubuntu/windows/macos x 3.11-3.13) stays as release
# verification. This is the development gate: one Linux, every push.
#
# NOTE ON RUNNERS. Every runner on this instance is a **shell** executor — both
# `common` and `docker-services` print `Preparing the "shell" executor`. There is
# no docker executor, so `image:` is silently ignored: the first version of this
# file asked for `python:3.11`, got the host's Debian python3.12, and `pip install`
# died on PEP 668 (externally-managed-environment). A python-version matrix is not
# possible here, and we do not need one — GitHub covers versions before a release.
#
# Consequences of a shell executor, all handled below:
#   * the workspace is REUSED between runs -> GIT_CLEAN_FLAGS wipes .tausik/, venv
#   * packages must go in a venv, never into the system python
#   * `git config --global` would write into the runner user's ~/.gitconfig and
#     leak into other projects' pipelines -> GIT_CONFIG_GLOBAL points at a job file

stages:
  - check
  - test
  # A THIRD stage, not a second job in `test`. Every runner here is a shell
  # executor sharing ONE workspace per project (GIT_CLEAN_FLAGS=-ffdx), so two
  # pytest jobs in one stage would run concurrently over the same directory and
  # clean the tree underneath each other. Stages are sequential; that is what
  # makes this safe, and it is the same argument the duplicate-pipeline guard
  # below already makes.
  - test-full

default:
  tags:
    - common
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONUTF8: "1"
  # FULL HISTORY. The citation audit asks git whether a file cited by a closed task once
  # existed and was deleted; at depth 50 that history is cut off and three tests of
  # test_bare_basename_is_not_invention.py fail on the runner while passing locally.
  GIT_DEPTH: "0"
  # The shell runner keeps the working copy between jobs. Without -ffdx a stale
  # .tausik/ from the previous run leaks into this one.
  GIT_CLEAN_FLAGS: -ffdx
  # OUTSIDE the checkout. A venv inside it gets picked up by anything that walks
  # the tree — `test_ble001_enforced` runs ruff over the whole repo, and ruff does
  # not skip a directory just because we consider it ours.
  VENV_DIR: /tmp/tausik-ci-venv-$CI_JOB_ID
  GIT_CFG: /tmp/tausik-ci-gitconfig-$CI_JOB_ID

# WHEN THIS PIPELINE RUNS. The header above calls this "the development gate:
# one Linux, every push". Until now the rules said something narrower — a branch
# push started a pipeline only when the branch WAS the default branch. Everything
# else pushed here was, as far as the machine was concerned, never built.
#
# The cost was measured, not assumed. On v1-9-wave — the branch the whole 1.9
# release is being written on — the API reports 0 pipelines against 79 pushed
# commits, no merge request exists to catch it as a merge_request_event, and no
# tag has been cut since v1.8.0. Three rules, none of them reachable, for 20 days.
# Two classes of defect grew in that gap and were found by hand instead: eleven
# ratchets that never executed in a clean checkout, and a blocking gate that was
# switched off for everyone who cloned. Both are only visible in an environment
# that is not the maintainer's working copy, which is exactly the environment
# these rules declined to build.
#
# So the rules now say what the header always said: every branch push builds.
# The default-branch rule is gone because `$CI_COMMIT_BRANCH` subsumes it — main
# is a branch. Keeping both would be a second way to say one thing, and the next
# person would have to work out whether the narrower one still meant something.
#
# The `when: never` rule is the standard duplicate-pipeline guard, and it is not
# decoration here. Once a merge request is open, a push matches BOTH the
# merge_request_event rule and the branch rule; without the guard GitLab starts
# two pipelines for one push. On this instance every runner is a SHELL executor
# sharing one workspace per project, so a duplicate is not merely wasteful — the
# two runs would clean and rebuild the same directory underneath each other.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Fail loudly if `venv` is missing rather than reaching for
# --break-system-packages, which would install into the runner's system python.
#
# TAUSIK's core has zero dependencies. These are the dev tools its own gates and
# tests invoke:
#   pytest — the suite, and `gen_doc_constants` counts tests by collecting it
#   PyYAML — WITHOUT it, tests/test_renar_{conformance,export}.py hit
#            `pytest.importorskip("yaml")` and their 36 tests are never collected.
#            That is exactly 4540 - 4504, the drift the first Linux run reported.
#            The count is a function of installed packages, not of the platform.
#   ruff   — `test_ble001_enforced` shells out to `python -m ruff` over the tree
#   mypy   — NOT a linter in this lane. `tests/test_mypy_gate_scope.py` drives the
#            mypy GATE as a subprocess fixture, so without the binary those tests
#            do not skip: the gate runner reports `Gate command not runnable` and
#            two tests go red about a runner nobody provisioned. Measured on Linux
#            before this line existed — exactly 2 failures, both this. GitHub's
#            test job has installed `ruff mypy bandit` all along; this list was
#            written from a different inventory and lost mypy on the way, which is
#            the same one-of-two-places provisioning drift that bit this file once
#            already. `bandit` is deliberately NOT added: no test in the lane this
#            pipeline runs asks for it, and an unmeasured package is a guess.
#   pytest-xdist — pyproject's addopts carry `-n auto`. Without the plugin pytest
#            exits on `unrecognized arguments: -n` before collecting anything, so
#            this is a hard dependency of every lane, not a speed option. The
#            ratchet is tests/test_ci_lanes_are_honest.py.
.venv: &venv
  - python3 --version
  - python3 -m venv --help > /dev/null || { echo "python3-venv is not installed on this runner"; exit 1; }
  - python3 -m venv "$VENV_DIR"
  - . "$VENV_DIR/bin/activate"
  - python -m pip install --quiet --upgrade pip
  - pip install --quiet -c ci-constraints.txt pytest pytest-xdist PyYAML ruff mypy
  # requirements.txt (mcp) is not optional here. `test_mcp_no_deprecated_primitives`
  # imports the MCP server to read the primitives it advertises; without the
  # package the test does not skip, it ERRORS with ModuleNotFoundError — a red
  # that says "your code is broken" about a runner that was never provisioned.
  # The file carries an upper bound, so this cannot drag in a major release.
  - pip install --quiet -r requirements.txt

lint:
  stage: check
  before_script: *venv
  script:
    - ruff check scripts/ tests/ bootstrap/

doc-constants:
  stage: check
  before_script: *venv
  script:
    # Needs pytest: `count_tests` shells out to `pytest --collect-only`, and when
    # that fails it falls back to the value already on disk — comparing the file
    # against itself. Run without pytest, this gate cannot fail.
    - python -c "import pytest, yaml" # the count depends on both
    - python scripts/gen_doc_constants.py --check

.test_setup: &test_setup
  - *venv
  # Six test modules drive a real git (clone, cat-file, ls-files).
  - git --version
  # Job-local git config: `--global` on a shared shell runner would rewrite the
  # runner user's ~/.gitconfig and affect every other project built here.
  - export GIT_CONFIG_GLOBAL="$GIT_CFG"
  - git config --global user.email "ci@tausik.local"
  - git config --global user.name "TAUSIK CI"
  # Linux already defaults to false; assert it so the supply-chain tests measure
  # against a known baseline. They simulate a hostile config themselves.
  - git config --global core.autocrlf false
  # The mirror-sync tests read .claude/settings.json, which is gitignored and so
  # absent from a fresh checkout. Without this they fail with FileNotFoundError
  # and it looks like a code regression.
  #
  # BOTH host profiles, not just claude. `.claude` and `.qwen` settings are
  # generated by DIFFERENT functions, and `test_both_host_profiles_are_actually_scanned`
  # exists precisely because the second one was forgotten once already. With
  # only claude deployed that test found one profile and failed on the runner
  # while passing on every developer machine — the guard against forgetting a
  # profile was itself defeated by a runner that had only one.
  #
  # `--ide all` rather than repeating the flag: `--ide` is a single choice,
  # not an appending one, so `--ide claude --ide qwen` would deploy qwen and
  # silently drop claude.
  - python bootstrap/bootstrap.py --no-detect --ide all

# The FAST lane: `-m 'not slow'` comes from pyproject's addopts. This is the
# answer a developer waits for, and it is kept fast on purpose — the owner named
# waiting as the pain, and the right response is to take verification off the
# critical path, not to run it less often.
tests:
  stage: test
  before_script: *test_setup
  script:
    # The two `--ignore` flags for the bootstrap modules are REMOVED (decision #275).
    # Be precise about what that buys HERE: nothing yet. This lane inherits
    # addopts = -m 'not slow' and both modules are module-level slow-marked, so they
    # were already deselected — the flags were a redundant second exclusion, copied
    # from GitHub in fd803f3. GitLab still has no full lane at all, which is why those
    # twelve tests remain unrun on this line; that is the separate open defect
    # `gitlab-has-no-full-lane-at-all`, and removing the flags does not close it.
    - >
      pytest tests/ -q --tb=short

# The FULL lane. Until this job existed, GitLab — the line development actually
# happens on (decision #267) — ran only the fast half: the job above inherits
# `-m 'not slow'` from addopts, and the slow-marked modules are this project's own
# regression tests (bootstrap wiring, MCP integration, subprocess smoke). They ran
# in GitHub alone, and the working branch does not go there by decision #260. So on
# the branch every line of 1.9 was written on, they ran NOWHERE.
#
# THE COST, MEASURED, NOT ESTIMATED (session #232, 20-core dev machine, `-n auto`):
# 9m03s for 10,023 passed + 27 skipped. The task's own notes carried 3m48s from an
# earlier tree; that number is stale and was not used. On this runner expect more —
# fewer cores, plus a venv and a pip install this job does not share with the one
# above.
#
# THE FIRST RUN OF IT FOUND A RED. The freshness ratchet over the committed
# ROADMAP is slow-marked, and it was failing in the tree at the moment this job was
# written — invisible to the fast lane for exactly as long as the fast lane was the
# only lane. That is the defect class this job exists for, caught by it immediately.
tests-full:
  stage: test-full
  before_script: *test_setup
  script:
    # `-m ''` is what reaches slow tests. NOT `--ignore` of anything: a marker
    # expression can still select what a marker deselected, while a path exclusion
    # is reachable by nothing — which is how twelve tests went unexecuted for a
    # year (decision #275).
    - >
      pytest tests/ -m '' -q --tb=short
