normative-inapplicability:
  disclaimer: 'Obligations of the standard that have no subject in this project, declared
    rather than passed over in silence. A declaration is NOT compliance: every sub-check
    these touch stays exactly as red as it was, and each entry names the premise that
    would end it.'
  declarations:
  - clause: §13.3.3 p.90 (negative scenario) / ADR-006 source table p.76
    obligation: a SPEC carries source.tz-section, always, for traceability; producing
      one from a ТЗ with neither source.tz-section nor source.adapt is the negative
      scenario stated literally
    inapplicable-because: the obligation presupposes a ТЗ, and no ТЗ exists here as
      an artifact. The SPEC anchor renar-adoption references decisions#109 — a record
      in our own database, not a specification handed to us — and the ADAPT relationship
      runs from ADAPT to SPEC, the direction opposite to the one the clause reads.
    decided-by: 'owner ruling, decision #307 (session #209)'
    evidence-ref: renar-first-tz-adapt
    not-a-claim-of-compliance: the sub-check spec-provenance-source stays RED; this
      declaration supplies the reason for the red, it does not remove it
    premise-watched-by: renar_normative_inapplicability.premise_broken
    applies-to:
    - at-generation-procedure
    - renar-adoption
    - sec-config-trust-tiers
    - team-state-in-git-format
  - clause: ADR-007 check-adapt-supersession, §10.11.1 p.485
    obligation: a control point catches a source.adapt reference left pointing at
      a withdrawn (superseded) ADAPT
    inapplicable-because: 'only for the SPEC half of the reference. `specs` holds
      none of the three provenance columns and decision #307 adds none, so a source.adapt
      reference cannot be written, let alone dangle — a gate over it would be the
      degenerate control this clause exists to prevent. The half that DOES have a
      subject was built instead: adapts.parent_adapt is a real column with a real
      foreign key, and renar_drift.detect_supersession_drift catches a delta-ADAPT
      hanging off a superseded parent.'
    decided-by: 'owner ruling, decision #307 (session #209), applied in session #212'
    evidence-ref: check-adapt-supersession-gate-has-no-subject-yet
    premise-watched-by: renar_normative_inapplicability.spec_adapt_reference_possible
    not-a-claim-of-compliance: the gate exists and RUNS over the carrier that exists;
      what is declared inapplicable is only the SPEC-side reference, which no column
      can hold
    applies-to:
    - at-generation-procedure
    - renar-adoption
    - sec-config-trust-tiers
    - team-state-in-git-format
  - clause: §13.3.8 / §10.11.1 implements-edge validation (RENAR v1.1)
    obligation: 'the carrier runs an implements-edge validation control point: target
      BR inside the approved set version of its system, no cycles, excluded target
      → warning, no implements[] on level: system'
    inapplicable-because: no table holds a BR, a level, or an implements column, so
      an implements[] edge cannot be written, let alone validated — a gate over it
      would be the degenerate control §13.9.4 exists to prevent. The mandatory-clause
      half is published as `vacuous` (implements-edge-subsystem) rather than hidden
      here.
    decided-by: 'owner instruction, decision #364 (session #250), corpus v1.1 at c3dd6b0'
    evidence-ref: renar-corpus-v11-reassessment
    not-a-claim-of-compliance: nothing validates an edge that cannot exist; what is
      declared is that the obligation has no subject, and the ratchet that would end
      the declaration is named
    premise-watched-by: renar_normative_inapplicability.implements_edge_carrier_exists
    applies-to:
    - at-generation-procedure
    - renar-adoption
    - sec-config-trust-tiers
    - team-state-in-git-format
