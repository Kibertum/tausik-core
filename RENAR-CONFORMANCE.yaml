# RENAR Conformance Manifest — auto-generated by `tausik renar conformance`.
# Level is computed from live DB state (§13.4.3), not declared. Do not
# hand-edit `level` / `mandatory-clauses-confirmed` — regenerate instead.
#
# §13.4.1 requires previous versions to survive as an audit journal.
# The journal is THIS FILE'S GIT HISTORY: the substrate's V1 immutable
# history (§3.3.1) is exactly the guarantee that clause asks for, so no
# parallel file-history mechanism is kept. Read an earlier version with
# `git log --follow -p RENAR-CONFORMANCE.yaml`; `replaces` names it.
#
# A `true` under mandatory-clauses-confirmed is not always a MEASUREMENT:
# `mandatory-clauses-basis` says, per clause, whether it was measured,
# judged over a published declaration, holds by running machinery, or
# is vacuous — and where the premise of each constant is watched.
#
# Every `true` under mandatory-clauses-confirmed is earned BY THE MEASURER
# that printed it, as far as we know: the measurer-caveats registry is
# empty, so no section appears below. That is a statement about our
# MEASURERS, not a claim of conformance — for that read `level` and
# `conformance-declaration`; and what each verdict rests on is in
# `mandatory-clauses-basis` above.
